# Deterministic evaluation suites (project doc §11.3).
#
# Every suite explicitly defines every condition. This prevents an Isaac Lab or
# training-config default from silently changing the evaluation distribution.
# Pose ranges are symmetric because Factory samples them as +/- an amplitude.
# The nominal pose ranges match the training task's hand-pose distribution; its
# dynamics are fixed at the asset defaults. OOD ranges extend beyond nominal.

nominal:
  episodes: 500
  seeds: [1000, 1001, 1002]
  conditions:
    initial_xy_offset_range_m: [-0.020, 0.020]
    initial_yaw_error_range_deg: [-45.0, 45.0]
    peg_friction_range: [0.75, 0.75]
    socket_friction_range: [0.75, 0.75]
    peg_mass_scale_range: [1.0, 1.0]

pose_shift:
  episodes: 500
  seeds: [1000, 1001, 1002]
  conditions:
    initial_xy_offset_range_m: [-0.030, 0.030]
    initial_yaw_error_range_deg: [-60.0, 60.0]
    peg_friction_range: [0.75, 0.75]
    socket_friction_range: [0.75, 0.75]
    peg_mass_scale_range: [1.0, 1.0]

low_friction:
  episodes: 500
  seeds: [1000, 1001, 1002]
  conditions:
    initial_xy_offset_range_m: [-0.020, 0.020]
    initial_yaw_error_range_deg: [-45.0, 45.0]
    peg_friction_range: [0.20, 0.40]
    socket_friction_range: [0.20, 0.40]
    peg_mass_scale_range: [1.0, 1.0]

high_friction:
  episodes: 500
  seeds: [1000, 1001, 1002]
  conditions:
    initial_xy_offset_range_m: [-0.020, 0.020]
    initial_yaw_error_range_deg: [-45.0, 45.0]
    peg_friction_range: [0.90, 1.20]
    socket_friction_range: [0.90, 1.20]
    peg_mass_scale_range: [1.0, 1.0]

mass_shift:
  episodes: 500
  seeds: [1000, 1001, 1002]
  conditions:
    initial_xy_offset_range_m: [-0.020, 0.020]
    initial_yaw_error_range_deg: [-45.0, 45.0]
    peg_friction_range: [0.75, 0.75]
    socket_friction_range: [0.75, 0.75]
    peg_mass_scale_range: [0.60, 1.50]

combined_ood:
  episodes: 1000
  seeds: [1000, 1001, 1002]
  conditions:
    initial_xy_offset_range_m: [-0.035, 0.035]
    initial_yaw_error_range_deg: [-70.0, 70.0]
    peg_friction_range: [0.20, 1.20]
    socket_friction_range: [0.20, 1.20]
    peg_mass_scale_range: [0.50, 1.70]
